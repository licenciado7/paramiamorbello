<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Te Amo 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--rosa:#ff2d8f;--rosa-suave:#ff8fc4;--oro:#e8c46a;--fondo:#05010a;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Quicksand',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#titulo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;font:italic 600 26px var(--serif);color:#fff;letter-spacing:.02em;text-shadow:0 0 14px rgba(255,45,143,.7);opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:3}
body.dentro #titulo{opacity:1}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;padding:20px}
#intro::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 45%,#2a0620 0,#0a0212 55%,#05010a 100%);transition:opacity .6s}
#intro.abre{pointer-events:none}#intro.abre::before{opacity:0}#intro.fuera{visibility:hidden}
.cuadro{position:relative;width:min(88vw,390px);padding:38px 24px 32px;border:1px solid rgba(255,130,195,.75);border-radius:20px;background:rgba(18,4,26,.78);box-shadow:0 0 30px rgba(255,45,143,.4),inset 0 0 28px rgba(255,45,143,.14);overflow:hidden;text-align:center;transition:opacity .5s,transform .5s}
#intro.abre .cuadro{opacity:0;transform:scale(.95)}
#cp{position:absolute;inset:0;width:100%;height:100%}
.txt{position:relative;z-index:1}
.mini{width:42px;height:42px;margin-bottom:10px;filter:drop-shadow(0 0 12px rgba(255,45,143,.9));animation:latido 1.6s ease-in-out infinite}
.l{opacity:0;margin:0 0 .45em;font:italic 500 21px/1.35 var(--serif);color:#fff;text-shadow:0 0 8px rgba(255,170,220,.95),0 0 20px rgba(255,45,143,.65);animation:aparece 1s ease forwards}
h1.l{font:italic 600 34px/1.15 var(--serif);margin:.55em 0 .35em;text-shadow:0 0 10px #fff,0 0 24px rgba(255,120,190,1),0 0 42px rgba(255,45,143,.8)}
.l1{animation-delay:.5s}.l2{animation-delay:1.9s}.l3{animation-delay:3.3s}.l4{animation-delay:5s}.l5{animation-delay:6.6s;font-size:25px}
#toca{margin:0;font:500 13px var(--sans);color:#f3dfe9;opacity:0;animation:aparece 1s ease 6s forwards}
#intro.abre #toca{animation:none;opacity:0}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
#musicaBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,130,195,.7);background:rgba(18,4,26,.6);color:#fff;font-size:18px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 14px rgba(255,45,143,.35);touch-action:manipulation}
body.dentro #musicaBtn{display:flex}#musicaBtn[hidden]{display:none!important}
#musicaBtn:focus-visible{outline:2px solid var(--rosa-suave);outline-offset:2px}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,235,248,.85),rgba(255,60,150,.5) 55%,rgba(255,45,143,0) 85%)}
#carta{position:fixed;left:50%;top:50%;width:min(86vw,380px);transform:translate(-50%,-48%) scale(.96);padding:22px 22px 18px;border:1px solid rgba(255,45,143,.65);border-radius:14px;background:rgba(14,3,16,.9);box-shadow:0 0 28px rgba(255,45,143,.35),inset 0 0 22px rgba(255,45,143,.12);opacity:0;visibility:hidden;transition:opacity .7s,transform .7s,visibility .7s;z-index:6;touch-action:auto;max-height:82vh;overflow-y:auto}
#carta.abierta{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
#carta h2{margin:0 0 12px;font:italic 600 24px var(--serif);color:var(--rosa)}
#carta p{margin:0 0 12px;font:500 13px/1.7 var(--sans);color:#f6eef3}
#carta .firma{margin:6px 0 0;text-align:right;font:italic 500 16px var(--serif);color:var(--oro)}
#cerrar{position:absolute;top:8px;right:12px;background:none;border:0;color:#d9b9cb;font-size:20px;line-height:1;padding:6px;cursor:pointer}
#cerrar:focus-visible{outline:2px solid var(--rosa-suave);border-radius:6px}
#pista{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;text-align:center;font:500 12px var(--sans);color:#e9cfe0;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
#pista.ver{opacity:.8}
#mano{position:fixed;left:0;top:0;font-size:20px;pointer-events:none;z-index:20;filter:grayscale(1) brightness(2.2) drop-shadow(0 0 4px #000);transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
#mano.ver{opacity:1}
@media (prefers-reduced-motion:reduce){.mini{animation:none}.l,#toca{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="titulo">Te Amo 💗</div>
<div id="flash"></div>
<button id="musicaBtn" aria-label="Silenciar música" aria-pressed="false">🔊</button>
<div id="intro" role="button" tabindex="0" aria-label="Continuar">
  <div class="cuadro" id="cuadro"><canvas id="cp"></canvas>
    <div class="txt">
      <svg class="mini" viewBox="0 0 100 90" aria-hidden="true"><defs><radialGradient id="g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ff9ccb"/><stop offset=".55" stop-color="#ff2d8f"/><stop offset="1" stop-color="#b3125f"/></radialGradient></defs><path d="M50 84C14 56 4 38 4 25 4 12 14 4 26 4c9 0 18 5 24 14C56 9 65 4 74 4c12 0 22 8 22 21 0 13-10 31-46 59z" fill="url(#g)"/></svg>
      <p class="l l1">Tal vez no es mucho,</p>
      <p class="l l2">pero esto es en lo que soy mejor,</p>
      <p class="l l3">y espero que te guste este bonito detalle.</p>
      <h1 class="l l4">Feliz cumple un mes,<br>mi amor</h1>
      <p class="l l5">Te amo 💗</p>
    </div>
  </div>
  <p id="toca">Toca para continuar</p>
</div>
<div id="carta" role="dialog" aria-live="polite"><button id="cerrar" aria-label="Cerrar carta">×</button><h2>Mi amor,</h2><div id="cuerpo"></div><p class="firma" id="firma"></p></div>
<div id="pista">Arrastra para girar · pellizca para acercar · toca el corazón y los planetas</div>
<div id="mano">✋</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====== PERSONALIZA AQUÍ ====== */
const MUSICA = "musica.mp3"; // pon tu canción junto al index.html con este nombre (déjalo "" para no usar música)
const FRASES = ["Mi universo eres tú","Eres mi refugio","Eres mi hogar","Contigo por siempre","Mi gravedad eres tú","Mi mayor suerte","Eres mi paz","Mi persona favorita","Siempre a tu lado","Eres mi estrella","Girando juntos","Mi órbita eres tú","Mi lugar seguro","Eres mi razón","Te elijo siempre","Mi todo","Un mes contigo","Feliz primer mes","Un mes y quiero mil más","Un mes de ti, mi lugar favorito","Gracias por este mes","Lo mejor de mi mes eres tú","Apenas empezamos, mi amor","Estoy aprendiendo a amarte","Gracias por tu paciencia","Cada día te quiero más","Contigo todo es nuevo y bonito"];
const FRASES_PLANETAS = [ // un mensaje por planeta, del sol hacia afuera (se abre al tocarlo)
 {p:["Hoy cumplimos un mes, y ya eres mi parte favorita del día.","Cada mensaje, cada risa y cada rato contigo me recuerdan lo bonito que es empezar algo así."],f:"Feliz primer mes."},
 {p:["Te amo mucho, más de lo que sé decir.","Esto es nuevo para mí, y aunque a veces me falten las palabras, lo que siento es verdadero."],f:"Con todo mi cariño."},
 {p:["Sé que he tenido fallas, y que no siempre te he demostrado todo lo que siento.","No es falta de amor: estoy aprendiendo, y quiero hacerlo bien contigo."],f:"Perdón y gracias."},
 {p:["Estoy aprendiendo a amarte, poco a poco y cada día mejor.","Me estoy acostumbrando a tenerte cerca, y cada día me gusta más."],f:"Aprendiendo contigo."},
 {p:["Amarte es nuevo y me está cambiando, para bien.","Me estoy acostumbrando a lo bonito de ti, y no quiero dejar de hacerlo."],f:"Contigo, siempre."},
 {p:["Gracias por tu paciencia conmigo en este primer mes.","Prometo esforzarme más cada día, con más detalles, más tiempo y más palabras bonitas."],f:"Lo prometo."},
 {p:["Un mes contigo y ya quiero muchos más.","Eres mi lugar favorito del universo, y aquí es donde quiero quedarme."],f:"Para siempre, mi amor."}
];
const COLORES = ["#ff9ccb","#8aa2ff","#f4c95d","#ffb36b","#c9a2ff","#ff6fae"];
const SPRITES_EMOJI = ["🎀","🕷️","🌸","💖","⭐","🧸"];
const SPRITES_IMAGEN = []; // opcional: ["fotos/kitty.png","fotos/arana.png"] (PNG con fondo transparente)
const CARTAS = [
 {p:["Hoy cumplimos un mes y siento que el tiempo se volvió más suave desde que llegaste. Un mes de risas, de mensajes que me hacen sonreír sin darme cuenta y de ganas de verte.","Si así se siente el principio, no quiero imaginar todo lo que viene. Gracias por quedarte, por cuidarme y por ser tan tú."],f:"Feliz primer mes, mi amor."},
 {p:["Cada cosa importante cae hacia lo que ama, y yo aprendí a caer hacia ti sin miedo a estrellarme. Tu gravedad es la única que me sostiene los días en que todo pesa.","Podemos girar despacio el resto de la vida, tú y yo, alrededor de esta misma luz. No necesito otro universo si en este me toca orbitarte a ti."],f:"Siempre tuyo."},
 {p:["Antes de ti mi cielo era un mapa sin nombres, puntos de luz sueltos que no llevaban a ningún lado. Llegaste y le pusiste sentido a cada estrella.","Nuestra órbita no es perfecta ni simétrica, y por eso me gusta tanto volver a ella. Te elijo con la calma con la que los planetas eligen su ruta."],f:"Contigo, aquí."},
 {p:["Sé que he tenido fallas y que a veces no te he demostrado todo lo que siento. No es falta de amor: es que esto es nuevo para mí, y estoy aprendiendo a amarte, a decírtelo y a cuidarlo bien.","Cada día me acostumbro más a tenerte, y cada día me gusta más. Gracias por tu paciencia en este primer mes. Prometo seguir aprendiendo, con más detalles, más tiempo y más palabras bonitas para ti."],f:"Aprendiendo a amarte."},
 {p:["Un mes es poco tiempo para el universo, pero para mí ya es una órbita entera: la de volver a ti cada día.","Quiero más conversaciones largas, más abrazos sin prisa y más meses a tu lado. Mientras tanto, esta galaxia es mía para decírtelo: te quiero."],f:"Un mes y lo que sigue."},
 {p:["Fuimos dos cometas que se cruzaron por azar, y decidimos convertir ese cruce en un camino que se parece a un hogar.","Prometo cuidarte con la paciencia con la que la noche cuida sus estrellas: sin apuro, sin ruido, sin apagarme nunca."],f:"Tuyo, siempre."}
];
/* ================================ */
const $=id=>document.getElementById(id);
const reducido=matchMedia('(prefers-reduced-motion:reduce)').matches;
const R=Math.random, gauss=()=>(R()+R()+R()+R()-2)/2;

function arrancar(){
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x05010a,1);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,1,.1,600);

function discoTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const disco=discoTex();
function puntos(pos,col,size,atten=true){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return new THREE.Points(g,new THREE.PointsMaterial({size,map:disco,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:atten}));
}

/* estrellas de fondo */
{const n=3800,p=new Float32Array(n*3),c=new Float32Array(n*3);
 for(let i=0;i<n;i++){const u=R()*2-1,a=R()*6.283,s=Math.sqrt(1-u*u),r=250;p.set([r*s*Math.cos(a),r*u,r*s*Math.sin(a)],i*3);const b=.5+R()*.5;c.set([b,b*.9,b],i*3)}
 scene.add(puntos(p,c,1.8,false))}

/* galaxia espiral */
const galaxia=new THREE.Group();scene.add(galaxia);
{const n=48000,p=new Float32Array(n*3),c=new Float32Array(n*3),RAD=52;
 for(let i=0;i<n;i++){
  const r=Math.pow(R(),.72)*RAD+1.5, brazo=i%2, giro=r*.17;
  const ang=brazo*Math.PI+giro+gauss()*(.55-r/RAD*.3);
  const rr=r+gauss()*(.6+r*.04);
  p.set([Math.cos(ang)*rr,gauss()*(.12+r*.012),Math.sin(ang)*rr],i*3);
  const t=Math.min(1,r/RAD), m=R();
  c.set([1,.82-t*.35+m*.15,.93-t*.15],i*3);
 }
 galaxia.add(puntos(p,c,.22))}
{const n=1400,p=new Float32Array(n*3),c=new Float32Array(n*3); /* bokeh grande */
 for(let i=0;i<n;i++){const r=Math.pow(R(),.8)*46+2,ang=(i%2)*Math.PI+r*.17+gauss()*.5;p.set([Math.cos(ang)*r,gauss()*.5,Math.sin(ang)*r],i*3);c.set([1,.6+R()*.3,.85],i*3)}
 galaxia.add(puntos(p,c,.9))}

/* corazón neón + pilar */
const corazon=new THREE.Group();corazon.position.y=3.2;scene.add(corazon);
{/* corazón 3D relleno: superficie de una ecuación implícita, muestreada en una fina cáscara */
 const n=7000,p=new Float32Array(n*3),c=new Float32Array(n*3),S=2.1;let k=0;
 while(k<n){
  const x=(R()*2-1)*1.25,y=(R()*2-1)*.95,z=(R()*2-1)*1.25;
  const q=x*x+2.25*y*y+z*z-1,f=q*q*q-x*x*z*z*z-.1125*y*y*z*z*z;
  if(f>0||f<-.035)continue;
  p.set([x*S,z*S,y*S*1.05],k*3);
  const h=(z+1.1)/2.4,w=R();
  c.set([1,.1+h*.3+w*.15,.42+h*.3],k*3);k++}
 corazon.add(puntos(p,c,.17))}
const luz=new THREE.Sprite(new THREE.SpriteMaterial({map:disco,color:0xff2d8f,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));
luz.scale.set(11,11,1);corazon.add(luz);
{const c=document.createElement('canvas');c.width=640;c.height=160;const x=c.getContext('2d');
 x.font='italic 600 64px "Cormorant Garamond",Georgia,serif';x.textAlign='center';x.textBaseline='middle';
 x.shadowColor='#ff2d8f';x.shadowBlur=18;x.fillStyle='#fff';x.fillText('Feliz 1 mes, mi amor',320,80);
 const t=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
 t.scale.set(8,2,1);t.position.y=3.9;corazon.add(t)}

/* etiquetas de texto y sprites que orbitan */
function spriteTexto(txt,col){
  const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
  x.textAlign='center';x.textBaseline='middle';x.shadowColor=col;x.shadowBlur=14;x.fillStyle=col;
  let ls=[txt];
  if(txt.length>19){const m=txt.length/2;let b=-1;for(let i=0;i<txt.length;i++)if(txt[i]===' '&&(b<0||Math.abs(i-m)<Math.abs(b-m)))b=i;if(b>0)ls=[txt.slice(0,b),txt.slice(b+1)]}
  let fs=ls.length>1?44:52;x.font='700 '+fs+'px Quicksand, sans-serif';
  const w=Math.max(...ls.map(l=>x.measureText(l).width));
  if(w>490){fs=Math.floor(fs*490/w);x.font='700 '+fs+'px Quicksand, sans-serif'}
  ls.forEach((l,i)=>x.fillText(l,256,ls.length>1?(i?92:38):64));
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  s.scale.set(5.2,1.3,1);return s}
function spriteEmoji(e){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.font='92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  s.scale.set(1.7,1.7,1);return s}
function colocar(s,r){const ang=R()*6.283;s.position.set(Math.cos(ang)*r,.5+R()*2.2,Math.sin(ang)*r);galaxia.add(s)}
FRASES.forEach((f,i)=>colocar(spriteTexto(f,COLORES[i%COLORES.length]),7+R()*34));
const loader=new THREE.TextureLoader();
for(let i=0;i<22;i++){
  let s;
  if(SPRITES_IMAGEN.length){s=new THREE.Sprite(new THREE.SpriteMaterial({map:loader.load(SPRITES_IMAGEN[i%SPRITES_IMAGEN.length]),transparent:true,depthWrite:false}));s.scale.set(2,2,1)}
  else s=spriteEmoji(SPRITES_EMOJI[i%SPRITES_EMOJI.length]);
  colocar(s,6+R()*38)}

/* sistema solar 3D sobre la galaxia (mismo radio, mismos colores) */
const sistema=new THREE.Group();sistema.position.y=22;sistema.rotation.x=.14;scene.add(sistema);
const orbitas=[],giros=[],planetas=[];
function anillo(n,r0,r1,hex,alt,tam,br=1){
  const p=new Float32Array(n*3),c=new Float32Array(n*3),col=new THREE.Color(hex);
  for(let i=0;i<n;i++){const r=r0+R()*(r1-r0),a=R()*6.283,k=(.6+R()*.4)*br;p.set([Math.cos(a)*r,gauss()*alt,Math.sin(a)*r],i*3);c.set([col.r*k,col.g*k,col.b*k],i*3)}
  return puntos(p,c,tam)}
function esfera(n,r,c1,c2){
  const p=new Float32Array(n*3),c=new Float32Array(n*3),a=new THREE.Color(c1),b=new THREE.Color(c2),m=new THREE.Color();
  for(let i=0;i<n;i++){const u=R()*2-1,f=R()*6.283,s=Math.sqrt(1-u*u),rr=r*(.86+R()*.14);p.set([rr*s*Math.cos(f),rr*u,rr*s*Math.sin(f)],i*3);m.copy(a).lerp(b,R());c.set([m.r,m.g,m.b],i*3)}
  return puntos(p,c,r*.09+.08)}
function halo(col,tam,op){const h=new THREE.Sprite(new THREE.SpriteMaterial({map:disco,color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));h.scale.set(tam,tam,1);return h}
/* sol en el centro */
{const sol=esfera(4200,2.7,'#fff3d1','#ff5fa8');sistema.add(sol);giros.push([sol,.3]);
 sistema.add(anillo(3000,3.2,7.5,'#ff9ccb',1.2,.16));
 sistema.add(halo(0xff5fa8,15,.55),halo(0xffc36b,30,.16));
 const t=spriteTexto('Tú eres mi sol','#f4c95d');t.position.y=6.4;t.scale.set(7,1.75,1);sistema.add(t)}
/* polvo del disco y cinturón de asteroides */
sistema.add(anillo(22000,3,52,'#ffb3dc',.35,.13,.6));
sistema.add(anillo(7000,29,35,'#e8c9ff',.5,.12));
/* planetas */
[[8,.7,'#ffd0e6','#ff7ab8',.5],[13,1,'#ff9ccb','#c0368a',.38],[19,1.15,'#c9a2ff','#7a5cff',.3],[25,.85,'#ffb36b','#ff5f9e',.24],
 [39,1.7,'#ffe3a3','#ff8fc4',.15],[45,1.3,'#8aa2ff','#d98cff',.12],[50,.9,'#ff6fae','#ffe0f0',.1]].forEach(([r,tam,c1,c2,v],i)=>{
  sistema.add(anillo(900,r-.07,r+.07,'#ff7ac0',.02,.09,.55));
  const pivote=new THREE.Group(),nodo=new THREE.Group();nodo.position.x=r;pivote.add(nodo);pivote.rotation.y=R()*6.283;
  const bola=esfera(Math.round(500+tam*500),tam,c1,c2);nodo.add(bola);giros.push([bola,.6]);
  nodo.add(halo(new THREE.Color(c2),tam*5,.22));
  planetas.push({nodo,tam,i});
  if(i===4){const an=anillo(3000,tam*1.5,tam*2.4,'#ffd1ea',.03,.1);an.rotation.x=.45;nodo.add(an)}
  if(i===2){const lp=new THREE.Group(),luna=esfera(160,.28,'#ffffff','#ffd0e6');luna.position.x=2.3;lp.add(luna);nodo.add(lp);orbitas.push([lp,1.4])}
  sistema.add(pivote);orbitas.push([pivote,v])});

/* lluvia de partículas rosas cayendo por el espacio */
const LL=7000,LLtop=50,LLbot=-16;
const llP=new Float32Array(LL*3),llC=new Float32Array(LL*3),llV=new Float32Array(LL),llF=new Float32Array(LL);

(function(){

const v3=new THREE.Vector3();
function tap(x,y){
  if(cartaAbierta||bloqueado)return;
  const foco=innerHeight/(2*Math.tan(cam.fov*Math.PI/360));
  let mejor=null,mr=1;
  const probar=(pos,radio,msg)=>{
    v3.copy(pos).project(cam);if(v3.z>=1)return;
    const r=Math.hypot(x-(v3.x+1)/2*innerWidth,y-(1-v3.y)/2*innerHeight)/radio;
    if(r<mr){mr=r;mejor=msg}};
  probar(corazon.position,Math.max(60,520/cam.position.length()*6),null);
  const wp=new THREE.Vector3();
  planetas.forEach(pl=>{pl.nodo.getWorldPosition(wp);
    const d=cam.position.distanceTo(wp),px=Math.min(150,Math.max(38,pl.tam*2/d*foco));
    probar(wp,px,FRASES_PLANETAS[pl.i])});
  if(mr<1)abrirCarta(mejor||undefined)}

const reloj=new THREE.Clock();

  if(entro){ /* entrada: de cerca y a ras, hacia una vista más abierta */
    const k=Math.min(1,(ahora-entro)/5200),e=1-Math.pow(1-k,3);
    if(k<1&&!ptrs.size){tRad=7+e*19;tPh=1.52-e*.42}

  const sp=Math.sin(ph);

  if(tiembla>.01){cam.position.x+=gauss()*tiembla*.35;cam.position.y+=gauss()*tiembla*.35}

  galaxia.rotation.y=t*.035;sistema.rotation.y=t*.04;
  orbitas.forEach(o=>o[0].rotation.y+=dt*o[1]);giros.forEach(o=>o[0].rotation.y+=dt*o[1]);
  corazon.rotation.y=t*.7;
  const lat=1+.06*Math.pow(Math.sin(t*2.4),2)+.03*Math.sin(t*5);
  corazon.scale.setScalar(lat*(1+pulso*.9));luz.material.opacity=Math.min(1,.28+.12*Math.sin(t*2.4)+pulso*.5);
  {const pa=lluvia.geometry.attributes.position,q=pa.array;
   for(let i=0;i<LL;i++){const j=i*3;q[j+1]-=llV[i]*dt;q[j]+=Math.sin(t*.7+llF[i])*.35*dt;
    if(q[j+1]<LLbot){q[j+1]=LLtop;const a=R()*6.283,r=Math.sqrt(R())*75;q[j]=Math.cos(a)*r;q[j+2]=Math.sin(a)*r}}
   pa.needsUpdate=true}

  galaxia.children.forEach((o,i)=>{if(o.isSprite)o.position.y+=Math.sin(t*1.2+i)*.0015});
  renderer.render(scene,cam);
}

      x.fillStyle=c+a+')';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()});
    const per=2*(W+H);
    run.forEach(r=>{r.s=(r.s+r.v*dt*.5)%1;let d=r.s*per,px,py;
      if(d<W){px=d;py=0}else if((d-=W)<H){px=W;py=d}else if((d-=H)<W){px=W-d;py=H}else{d-=W;px=0;py=H-d}
      x.fillStyle='rgba(255,200,230,.9)';x.beginPath();x.arc(px,py,1.5,0,6.283);x.fill();
      x.fillStyle='rgba(255,45,143,.22)';x.beginPath();x.arc(px,py,5,0,6.283);x.fill()});
  }
  requestAnimationFrame(dib);
})();
const carga=Promise.race([Promise.all([document.fonts.load('700 52px Quicksand'),document.fonts.load('italic 600 24px "Cormorant Garamond"')]),new Promise(r=>setTimeout(r,2500))]);
carga.catch(()=>{}).then(arrancar);
